name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/claude-uds-bridge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

      # dist/ is committed and `codex plugin marketplace add` installs from the branch,
      # so a bundle that lags src/ ships stale code with no error anywhere.
      - name: Committed bundle matches src
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eu
          bun run build
          git diff --exit-code -- dist || {
            echo "::error::dist is stale. Run 'bun run build' and commit the result."
            exit 1
          }
